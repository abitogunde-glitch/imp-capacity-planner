<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Implementation Team - Capacity Planner 2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', 'Segoe UI', sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #3b82f6; }
    .header-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
    .header-title { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
    .export-btn { padding: 9px 18px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .15s; white-space: nowrap; }
    .export-btn:hover { background: #2563eb; }
    .main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 28px; }
    .section-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; letter-spacing: -.01em; }
    .section-subtitle { font-size: 13px; color: #64748b; margin-bottom: 14px; line-height: 1.6; }
    .status-banner { padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; }
    .status-banner.loading { background: #f1f5f9; color: #64748b; }
    .status-banner.loaded  { background: #dcfce7; color: #15803d; }
    .status-banner.error   { background: #fee2e2; color: #dc2626; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .summary-grid { grid-template-columns: repeat(2,1fr); } }
    .summary-card { background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04); }
    .summary-quarter { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
    .summary-hours { font-size: 36px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-bottom: 4px; font-family: 'DM Mono', monospace; }
    .summary-unit { font-size: 14px; font-weight: 400; color: #94a3b8; }
    .summary-pct { font-size: 13px; color: #64748b; margin-bottom: 12px; }
    .progress-track { height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; }
    .summary-footnote { font-size: 11px; color: #cbd5e1; }
    .how-wrapper { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04); }
    .how-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 24px; background: none; border: none; font-size: 14px; font-weight: 600; color: #334155; cursor: pointer; font-family: inherit; }
    .how-toggle:hover { background: #f8fafc; }
    .how-chevron { font-size: 11px; color: #94a3b8; }
    .how-body { padding: 24px; border-top: 1px solid #f1f5f9; }
    .how-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .how-block { background: #f8fafc; border-radius: 10px; padding: 16px; font-size: 13px; color: #334155; line-height: 1.6; }
    .how-block-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #475569; margin-bottom: 10px; }
    .how-formula { background: #e2e8f0; border-radius: 6px; padding: 6px 10px; font-family: 'DM Mono', monospace; font-size: 12px; color: #1e293b; margin: 6px 0; }
    .how-pill { padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; margin-bottom: 6px; display: inline-block; width: 100%; }
    .how-pill.green { background: #dcfce7; color: #16a34a; }
    .how-pill.yellow { background: #fef9c3; color: #b45309; }
    .how-pill.red { background: #fee2e2; color: #dc2626; }
    .how-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
    .how-table th { text-align: left; padding: 5px 8px; background: #e2e8f0; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase; }
    .how-table td { padding: 5px 8px; border-bottom: 1px solid #e2e8f0; }
    .table-wrapper { overflow-x: auto; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04); }
    .main-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; min-width: 900px; }
    .main-table thead th { padding: 11px 14px; background: #f1f5f9; border-bottom: 2px solid #e2e8f0; font-size: 11px; font-weight: 700; color: #475569; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; text-align: center; }
    .main-table thead th.left { text-align: left; }
    .main-table thead th.total-col { background: #e2e8f0; color: #334155; }
    .main-table tbody tr:nth-child(even) { background: #f8fafc; }
    .main-table tbody tr:hover { background: #eff6ff; }
    .main-table td { padding: 9px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; text-align: center; font-family: 'DM Mono', monospace; }
    .main-table td.left { text-align: left; font-weight: 500; font-family: 'DM Sans', sans-serif; }
    .main-table td.muted { color: #64748b; }
    .main-table td.total-col { background: #f1f5f9; font-weight: 700; color: #1e293b; }
    .main-table tfoot tr.baseline td { background: #f1f5f9; font-style: italic; color: #64748b; font-size: 12px; padding: 8px 14px; font-family: 'DM Sans', sans-serif; }
    .main-table tfoot tr.totals td { background: #1e293b; color: #e2e8f0; padding: 11px 14px; font-weight: 700; font-family: 'DM Mono', monospace; }
    .main-table tfoot tr.hire td { background: #0f172a; color: #64748b; padding: 9px 14px; font-size: 12px; font-family: 'DM Mono', monospace; }
    .page-footer { text-align: center; font-size: 12px; color: #cbd5e1; padding-top: 16px; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const QUARTERS = ['Q1', 'Q2', 'Q3', 'Q4'];
    const DEFAULT_ASSUMPTIONS = { baselineHours: 130, capacityThreshold: 935, yellowThreshold: 0.85 };
    const SPREADSHEET_ID = '16XQnVVZNh1Vak5PaCaAjbI6H55yTuEdxvvYNl3sKFpQ';
    const SHEET_TAB = 'Live';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
    const FULL_SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit#gid=2141878066`;

    function parseCSV(text) {
      const rows = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        if (!line.trim()) continue;
        const cells = [];
        let inQuote = false, cell = '';
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') { if (inQuote && line[i+1] === '"') { cell += '"'; i++; } else { inQuote = !inQuote; } }
          else if (c === ',' && !inQuote) { cells.push(cell.trim()); cell = ''; }
          else { cell += c; }
        }
        cells.push(cell.trim());
        rows.push(cells);
      }
      return rows;
    }

    function parseSheetRows(rows) {
      // Skip the first row ("Data Inputs" title). The column-header row and summary
      // rows are excluded by the filter below.
      return rows.slice(1).filter(row => {
        const name     = (row[0] || '').trim();
        const hoursStr = (row[1] || '').trim();
        const hours    = parseInt(hoursStr, 10);
        // Row must have a non-empty name and a clean whole-number hours value
        if (!name || isNaN(hours) || hours <= 0 || hoursStr !== String(hours)) return false;
        // All four deal counts must be small non-negative integers (≤ 50).
        // This excludes the summary-table rows whose "deal" columns contain
        // hours totals (e.g. 250, 573, 715) or percentages (e.g. 61.28).
        const q1 = parseFloat(row[3] || '0');
        const q2 = parseFloat(row[4] || '0');
        const q3 = parseFloat(row[5] || '0');
        const q4 = parseFloat(row[6] || '0');
        return [q1, q2, q3, q4].every(v => !isNaN(v) && v >= 0 && v <= 50);
      }).map(row => ({
        type:  row[0].trim(),
        hours: parseInt(row[1], 10),
        deals: {
          Q1: parseFloat(row[3]) || 0,
          Q2: parseFloat(row[4]) || 0,
          Q3: parseFloat(row[5]) || 0,
          Q4: parseFloat(row[6]) || 0
        }
      }));
    }

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastRefreshed, setLastRefreshed] = useState('');
      const [isHowOpen, setIsHowOpen] = useState(false);

      useEffect(() => { fetchData(); const iv = setInterval(fetchData, 300000); return () => clearInterval(iv); }, []);

      const fetchData = async () => {
        try {
          setLoading(true);
          const response = await fetch(SHEET_URL);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const csvText = await response.text();
          const rows = parseCSV(csvText);
          const formattedData = parseSheetRows(rows);
          if (formattedData.length === 0) throw new Error('No data rows found — check sheet is shared as Anyone with link can view');
          setData(formattedData);
          setLastRefreshed(new Date().toLocaleTimeString());
          setError(null);
        } catch (err) {
          setError(`Failed to load: ${err.message}`);
        } finally { setLoading(false); }
      };

      const calcQuarterHours = (q) => DEFAULT_ASSUMPTIONS.baselineHours + data.reduce((sum, item) => sum + (item.hours * item.deals[q]), 0);
      const getStatus = (hours) => {
        const pct = hours / DEFAULT_ASSUMPTIONS.capacityThreshold;
        if (pct >= 1) return { label: 'CRITICAL', color: '#ef4444', bg: '#fee2e2' };
        if (pct >= DEFAULT_ASSUMPTIONS.yellowThreshold) return { label: 'AT CAPACITY', color: '#f59e0b', bg: '#fef9c3' };
        return { label: 'LOOKING GOOD', color: '#10b981', bg: '#dcfce7' };
      };
      const handleExport = () => {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(data.map(item => ({ 'Project Type': item.type, 'Hrs/Deal': item.hours, 'Q1 Deals': item.deals.Q1, 'Q2 Deals': item.deals.Q2, 'Q3 Deals': item.deals.Q3, 'Q4 Deals': item.deals.Q4 })));
        XLSX.utils.book_append_sheet(wb, ws, "Capacity Data");
        XLSX.writeFile(wb, "Implementation_Capacity_2026.xlsx");
      };

      return (
        <div>
          <header className="header">
            <div>
              <div className="header-eyebrow">Implementation Team - Pelago Health</div>
              <h1 className="header-title">Capacity Planner</h1>
            </div>
            <button className="export-btn" onClick={handleExport}>Download Excel</button>
          </header>
          <main className="main">
            <div className={`status-banner ${loading ? 'loading' : error ? 'error' : 'loaded'}`}>
              {loading ? 'Loading data from Google Sheets...' : error ? error : (
                <span>&#10003; Live data · Last refreshed {lastRefreshed} · <a href={FULL_SHEET_URL} target="_blank" rel="noreferrer" style={{color:'inherit'}}>Open Sheet &#8599;</a></span>
              )}
            </div>
            {!loading && !error && (<>
              <div className="how-wrapper">
                <button className="how-toggle" onClick={() => setIsHowOpen(!isHowOpen)}>
                  <span>How This Works</span><span className="how-chevron">{isHowOpen ? '▲' : '▼'}</span>
                </button>
                {isHowOpen && (
                  <div className="how-body"><div className="how-grid">
                    <div className="how-block"><div className="how-block-title">Core Formula</div>
                      <div className="how-formula">130h baseline + (Deals × Hrs/Deal)</div>
                      <p>130h = 5 hrs/week × 13 weeks × 2 FTEs</p>
                    </div>
                    <div className="how-block"><div className="how-block-title">Status Thresholds</div>
                      <div className="how-pill green">Safe: &lt; 85%</div>
                      <div className="how-pill yellow">Warning: 85–100%</div>
                      <div className="how-pill red">Critical: &gt; 100% (935h+)</div>
                    </div>
                    <div className="how-block"><div className="how-block-title">Project Weights</div>
                      <table className="how-table"><thead><tr><th>Type</th><th>Hours</th></tr></thead>
                        <tbody>{data.map(d => <tr key={d.type}><td>{d.type}</td><td>{d.hours}</td></tr>)}</tbody>
                      </table>
                    </div>
                  </div></div>
                )}
              </div>
              <section>
                <h2 className="section-title">Quarterly Capacity Summary</h2>
                <div className="summary-grid">
                  {QUARTERS.map(q => {
                    const hrs = calcQuarterHours(q);
                    const pct = (hrs / DEFAULT_ASSUMPTIONS.capacityThreshold * 100).toFixed(1);
                    const status = getStatus(hrs);
                    return (
                      <div key={q} className="summary-card">
                        <div className="summary-quarter">{q} 2026</div>
                        <div className="summary-hours">{Math.round(hrs)} <span className="summary-unit">hrs</span></div>
                        <div className="summary-pct">{pct}% capacity</div>
                        <div className="progress-track">
                          <div className="progress-fill" style={{width:`${Math.min(parseFloat(pct),100)}%`,background:status.color}}></div>
                        </div>
                        <div className="status-badge" style={{background:status.bg,color:status.color}}>{status.label}</div>
                        <div className="summary-footnote">Threshold: {DEFAULT_ASSUMPTIONS.capacityThreshold} hrs</div>
                      </div>
                    );
                  })}
                </div>
              </section>
              <section>
                <h2 className="section-title">Deal Counts by Quarter</h2>
                <p className="section-subtitle">Live from Google Sheets "Live" tab · auto-refreshes every 5 min</p>
                <div className="table-wrapper">
                  <table className="main-table">
                    <thead><tr>
                      <th className="left">Project Type</th><th>Hrs/Deal</th>
                      {QUARTERS.map(q => <th key={q}>{q} Deals</th>)}
                      {QUARTERS.map(q => <th key={q}>{q} Hrs</th>)}
                      <th className="total-col">Total Hrs</th>
                    </tr></thead>
                    <tbody>
                      {data.map(item => {
                        const rowTotal = QUARTERS.reduce((sum,q) => sum+(item.hours*item.deals[q]),0);
                        return (<tr key={item.type}>
                          <td className="left">{item.type}</td><td className="muted">{item.hours}</td>
                          {QUARTERS.map(q => <td key={q}>{item.deals[q]}</td>)}
                          {QUARTERS.map(q => <td key={q} className="muted">{Math.round(item.hours*item.deals[q])}</td>)}
                          <td className="total-col">{Math.round(rowTotal)}</td>
                        </tr>);
                      })}
                    </tbody>
                    <tfoot>
                      <tr className="baseline">
                        <td className="left" colSpan="2">Internal / General Work (Baseline)</td>
                        <td colSpan="4">--</td>
                        {QUARTERS.map(q => <td key={q}>{DEFAULT_ASSUMPTIONS.baselineHours/4}</td>)}
                        <td>{DEFAULT_ASSUMPTIONS.baselineHours}</td>
                      </tr>
                      <tr className="totals">
                        <td className="left" colSpan="6">Total Quarterly Workload</td>
                        {QUARTERS.map(q => <td key={q}>{Math.round(calcQuarterHours(q))}</td>)}
                        <td>{Math.round(QUARTERS.reduce((s,q)=>s+calcQuarterHours(q),0))}</td>
                      </tr>
                      <tr className="hire">
                        <td className="left" colSpan="6">Hiring Trigger (&gt;{DEFAULT_ASSUMPTIONS.capacityThreshold}h)</td>
                        {QUARTERS.map(q => (
                          <td key={q} style={{color:calcQuarterHours(q)>DEFAULT_ASSUMPTIONS.capacityThreshold?'#ef4444':'#22c55e',fontWeight:'700'}}>
                            {calcQuarterHours(q)>DEFAULT_ASSUMPTIONS.capacityThreshold?'YES':'NOT YET'}
                          </td>
                        ))}
                        <td>--</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </section>
            </>)}
            <footer className="page-footer">Implementation Team Capacity Model v2.5 · Pelago Health Proprietary</footer>
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body></html>

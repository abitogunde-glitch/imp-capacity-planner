<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Implementation Capacity Planner 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --border: #e2e6ea;
      --text: #1a1d23;
      --muted: #6b7280;
      --brand: #4f46e5;
      --green: #16a34a;
      --yellow: #d97706;
      --red: #dc2626;
      --red-light: #fee2e2;
      --green-light: #dcfce7;
      --yellow-light: #fef9c3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    header .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .header-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.78rem; font-weight: 600; padding: 4px 10px;
      border-radius: 99px; background: var(--red-light); color: var(--red);
    }
    .badge.ok { background: var(--green-light); color: var(--green); }
    .sync-row { display:flex; align-items:center; gap:8px; }
    .sync-status { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .sync-status .dot {
      display:inline-block; width:7px; height:7px; border-radius:50%;
      background: var(--green); margin-right:5px;
    }
    .sync-status .dot.err { background: var(--red); }
    #refreshBtn {
      font-size: 0.72rem; font-weight: 600; color: var(--brand);
      background: none; border: 1px solid var(--border); border-radius: 99px;
      padding: 3px 10px; cursor: pointer;
    }
    #refreshBtn:hover { background: #f3f4f6; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 48px; }
    .summary-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px;
    }
    @media (max-width: 700px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
    .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .summary-card .quarter {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px;
    }
    .summary-card .hours { font-size: 2rem; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .summary-card .pct { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    .summary-card .hire-pill {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      padding: 3px 9px; border-radius: 99px; letter-spacing: 0.04em; margin-top: 10px;
    }
    .hire-pill.no  { background: var(--green-light); color: var(--green); }
    .hire-pill.yes { background: var(--red-light); color: var(--red); }
    .summary-card.over { border-color: #fca5a5; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .card .card-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 20px; }
    .chart-wrap { position: relative; height: 280px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead th {
      text-align: left; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid var(--border);
    }
    thead th:not(:first-child) { text-align: center; }
    tbody tr:hover { background: #f9fafb; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
    tbody td:not(:first-child) { text-align: center; font-variant-numeric: tabular-nums; }
    tbody td:first-child { font-weight: 500; }
    .totals-row td { font-weight: 700; background: #f3f4f6; border-top: 2px solid var(--border); }
    .note { font-size: 0.78rem; color: var(--muted); margin-top: 16px; line-height: 1.6; }
    .meter-bar { display: flex; align-items: center; gap: 8px; }
    .meter-track { flex: 1; height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
    .meter-label { font-size: 0.78rem; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; color: var(--muted); }
    .state-msg {
      background: var(--card); border: 1px dashed var(--border); border-radius: 12px;
      padding: 18px; font-size: 0.85rem; color: var(--muted);
    }
    .state-msg.error { border-color: var(--red); color: var(--red); background: var(--red-light); }
  </style>
</head>
<body>
<header>
  <div>
    <h1>Implementation Capacity Planner 2026</h1>
    <div class="subtitle">Pelago Health · Implementation Team (2 FTEs) · Max capacity: 935 hrs/quarter</div>
  </div>
  <div class="header-right">
    <span class="badge" id="hire-badge">Loading…</span>
    <div class="sync-row">
      <span class="sync-status" id="syncStatus"><span class="dot" id="syncDot"></span>Loading…</span>
      <button id="refreshBtn">Refresh now</button>
    </div>
  </div>
</header>
<main>
  <div id="app">
    <div class="state-msg" id="loadingMsg">Pulling the latest numbers from the Google Sheet…</div>
  </div>
</main>

<script>
// ---- CONFIG ----
const SHEET_ID = "16XQnVVZNh1Vak5PaCaAjbI6H55yTuEdxvvYNl3sKFpQ";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const REFRESH_MS = 5 * 60 * 1000; // auto-refresh every 5 minutes while the page is open
const MAX_CAPACITY = 935;

// ---- CSV PARSER (handles quoted commas) ----
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function cell(rows, r, c){ if(!rows[r]) return ""; return (rows[r][c] || "").trim(); }

function parseSheet(rows){
  // Only reads the first "Data Inputs" / "Summary Table" block -- the live one at
  // the top of the sheet. Historical snapshot blocks further down are ignored.
  let dataInputsIdx = -1;
  for(let r=0; r<rows.length; r++){
    if(cell(rows, r, 0).toLowerCase() === "data inputs"){ dataInputsIdx = r; break; }
  }
  if(dataInputsIdx === -1) throw new Error('Could not find "Data Inputs" section in the sheet.');

  const headerIdx = dataInputsIdx + 1;
  const implementations = [];
  let r = headerIdx + 1;
  while(r < rows.length && cell(rows, r, 0).toUpperCase() !== "TOTALS"){
    if(cell(rows, r, 0) === ""){ r++; continue; }
    implementations.push({
      name: cell(rows, r, 0),
      hrsPerProject: parseFloat(cell(rows, r, 1)) || 0,
      q1: parseFloat(cell(rows, r, 3)) || 0,
      q2: parseFloat(cell(rows, r, 4)) || 0,
      q3: parseFloat(cell(rows, r, 5)) || 0,
      q4: parseFloat(cell(rows, r, 6)) || 0,
    });
    r++;
  }

  let summaryIdx = -1;
  for(let rr=r; rr<rows.length; rr++){
    if(cell(rows, rr, 0).toLowerCase() === "summary table"){ summaryIdx = rr; break; }
  }
  if(summaryIdx === -1) throw new Error('Could not find "Summary Table" section in the sheet.');

  const hoursRow = rows[summaryIdx + 2] || [];
  const pctRow = rows[summaryIdx + 3] || [];
  const hireRow = rows[summaryIdx + 4] || [];

  const summary = ["Q1","Q2","Q3","Q4"].map((q, i) => ({
    quarter: q,
    hours: parseFloat((hoursRow[i+1] || "0").trim()) || 0,
    pct: parseFloat((pctRow[i+1] || "0").replace("%","").trim()) || 0,
    hireFlag: ((hireRow[i+1] || "").trim().toUpperCase().includes("YES")),
  }));

  return { implementations, summary };
}

function render(data){
  const { implementations, summary } = data;
  const anyHire = summary.some(s => s.hireFlag);
  const hireBadge = document.getElementById("hire-badge");
  if(anyHire){
    const q = summary.find(s => s.hireFlag).quarter;
    hireBadge.className = "badge";
    hireBadge.textContent = `⚠ Hire needed in ${q}`;
  } else {
    hireBadge.className = "badge ok";
    hireBadge.textContent = "✓ On track";
  }

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="summary-grid" id="summary-grid"></div>
    <div class="card">
      <h2>Quarterly capacity utilization</h2>
      <div class="card-desc">Hours used vs. 935-hour capacity threshold (10% buffer applied). Red dashed line = hire trigger.</div>
      <div class="chart-wrap"><canvas id="capacityChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Deals closing by implementation type</h2>
      <div class="card-desc">Number of deals closing per quarter. Hours per project shown for reference.</div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>Implementation type</th><th>Hrs/project</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>
          </thead>
          <tbody id="deals-tbody"></tbody>
        </table>
      </div>
      <p class="note">Each project is owned by one team member. General implementation work = 5 hrs/week/person. Ad-hoc team projects run throughout the year, so this may increase depending on internal initiatives.</p>
    </div>
    <div class="card">
      <h2>Capacity detail</h2>
      <div class="card-desc">Total hours worked per quarter vs. max capacity (935 hrs). Includes project hours + general implementation work.</div>
      <table>
        <thead><tr><th>Metric</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr></thead>
        <tbody id="summary-tbody"></tbody>
      </table>
    </div>
  `;

  // ---- summary cards ----
  const grid = document.getElementById("summary-grid");
  summary.forEach(s => {
    const over = s.hours > MAX_CAPACITY;
    const color = over ? "var(--red)" : s.pct >= 80 ? "var(--yellow)" : "var(--green)";
    const fillPct = Math.min(s.pct, 100);
    const card = document.createElement("div");
    card.className = "summary-card" + (over ? " over" : "");
    card.innerHTML = `
      <div class="quarter">${s.quarter}</div>
      <div class="hours" style="color:${color}">${s.hours.toLocaleString()}</div>
      <div class="pct">${s.pct.toFixed(2)}% of capacity</div>
      <div class="meter-bar">
        <div class="meter-track"><div class="meter-fill" style="width:${fillPct}%;background:${color}"></div></div>
        <span class="meter-label">${s.pct.toFixed(0)}%</span>
      </div>
      <span class="hire-pill ${s.hireFlag ? 'yes' : 'no'}">${s.hireFlag ? '⚠ HIRE' : '✓ OK'}</span>
    `;
    grid.appendChild(card);
  });

  // ---- chart ----
  const ctx = document.getElementById("capacityChart").getContext("2d");
  if(window._capacityChart) window._capacityChart.destroy();
  window._capacityChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: summary.map(s => s.quarter),
      datasets: [{
        label: "Hours used",
        data: summary.map(s => s.hours),
        backgroundColor: summary.map(s =>
          s.hours > MAX_CAPACITY ? "rgba(220,38,38,0.75)" :
          s.pct >= 80 ? "rgba(217,119,6,0.75)" : "rgba(79,70,229,0.75)"
        ),
        borderColor: summary.map(s =>
          s.hours > MAX_CAPACITY ? "rgba(220,38,38,1)" :
          s.pct >= 80 ? "rgba(217,119,6,1)" : "rgba(79,70,229,1)"
        ),
        borderWidth: 1.5,
        borderRadius: 6,
        maxBarThickness: 80,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => ` ${c.parsed.y.toLocaleString()} hrs (${summary[c.dataIndex].pct.toFixed(2)}% capacity)`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          suggestedMax: Math.max(1200, ...summary.map(s => s.hours)) * 1.05,
          grid: { color: "#f3f4f6" },
          ticks: { callback: v => v.toLocaleString(), color: "#6b7280" },
          title: { display: true, text: "Hours", color: "#6b7280", font: { size: 11 } }
        },
        x: { grid: { display: false }, ticks: { color: "#6b7280" } }
      }
    },
    plugins: [{
      id: "threshold-line",
      afterDraw(chart) {
        const { ctx, scales: { y, x } } = chart;
        const yPos = y.getPixelForValue(MAX_CAPACITY);
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = "rgba(220,38,38,0.7)";
        ctx.lineWidth = 1.5;
        ctx.moveTo(x.left, yPos);
        ctx.lineTo(x.right, yPos);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(220,38,38,0.85)";
        ctx.font = "11px -apple-system, sans-serif";
        ctx.fillText(`Hire threshold (${MAX_CAPACITY} hrs)`, x.left + 6, yPos - 6);
        ctx.restore();
      }
    }]
  });

  // ---- deals table ----
  const tbody = document.getElementById("deals-tbody");
  let totals = { q1: 0, q2: 0, q3: 0, q4: 0 };
  implementations.forEach(impl => {
    totals.q1 += impl.q1; totals.q2 += impl.q2;
    totals.q3 += impl.q3; totals.q4 += impl.q4;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${impl.name}</td>
      <td>${impl.hrsPerProject}</td>
      <td>${impl.q1 || "—"}</td>
      <td>${impl.q2 || "—"}</td>
      <td>${impl.q3 || "—"}</td>
      <td>${impl.q4 || "—"}</td>
    `;
    tbody.appendChild(tr);
  });
  const totalsRow = document.createElement("tr");
  totalsRow.className = "totals-row";
  totalsRow.innerHTML = `<td>TOTALS</td><td>—</td><td>${totals.q1}</td><td>${totals.q2}</td><td>${totals.q3}</td><td>${totals.q4}</td>`;
  tbody.appendChild(totalsRow);

  // ---- capacity detail table ----
  const summaryTbody = document.getElementById("summary-tbody");
  const rowsDef = [
    { label: "Total hours", fmt: s => s.hours.toLocaleString() },
    { label: "Capacity %", fmt: s => s.pct.toFixed(2) + "%" },
    { label: "Need to hire?", fmt: s => s.hireFlag ? "YES" : "NOT YET" },
  ];
  summaryTbody.innerHTML = rowsDef.map(rd => `
    <tr><td>${rd.label}</td>${summary.map(s => `<td>${rd.fmt(s)}</td>`).join("")}</tr>
  `).join("");
}

async function loadData(){
  const dot = document.getElementById("syncDot");
  const statusEl = document.getElementById("syncStatus");
  try{
    statusEl.innerHTML = `<span class="dot" id="syncDot"></span>Syncing…`;
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if(!res.ok) throw new Error(`Sheet fetch failed (HTTP ${res.status}). Check sharing settings.`);
    const text = await res.text();
    const rows = parseCSV(text);
    const data = parseSheet(rows);
    render(data);
    const now = new Date();
    document.getElementById("syncStatus").innerHTML = `<span class="dot" id="syncDot"></span>Synced ${now.toLocaleTimeString()}`;
  } catch(err){
    document.getElementById("syncStatus").innerHTML = `<span class="dot err" id="syncDot"></span>Sync failed`;
    document.getElementById("app").innerHTML = `
      <div class="state-msg error">
        <strong>Couldn't load live data.</strong><br/>
        ${err.message}<br/><br/>
        Most common fix: in the Google Sheet, go to Share → General access → set to
        "Anyone with the link" (Viewer). This page reads the sheet directly from the browser.
      </div>`;
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadData);
loadData();
setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
